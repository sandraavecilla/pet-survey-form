<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css">
    <title>Pet Survey Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div class="container">
      <div class="left-cover">
        <h1 id="title" class="title">MY PET SURVEY FORM</h1>
        <p id="description" class="description">Tell us about your furry friend!</p>
      </div>
      <div class="right-container">
        <form id="survey-form">
          <div class="form-pet">
            <h1 id="pet-title" class="form-title">PET INFORMATION</h1>
            <div class="form-group">
              <label id="name-label" for="name">Name</label>
              <input type="text" name="name" id="name" placeholder="Enter your pet's name">
            </div>
          </div>
          <div class="form-client">

          </div>
        </form>
      </div>
  </div>
  </body>
</html>
